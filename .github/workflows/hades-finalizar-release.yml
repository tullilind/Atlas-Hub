name: HADES - Finalizar release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag draft, exemplo: hades-v0.9.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validar tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" == hades-v* ]] || { echo "Tag inválida: $TAG"; exit 1; }
          VERSION="${TAG#hades-v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:\.\d+)?", sys.argv[1]):
              raise SystemExit("Versão inválida: " + sys.argv[1])
          PY
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Conferir release draft
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft >/tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json'))
          if not data.get('isDraft'):
              raise SystemExit('A release não está em modo draft.')
          PY

      - name: Baixar artefatos e hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hades-release
          gh release download "$TAG" --repo "${{ github.repository }}" --dir .hades-release --pattern "HADES-Setup-$VERSION-windows-x64.exe"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir .hades-release --pattern "HADES-Setup-$VERSION-windows-x64.exe.sha256"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir .hades-release --pattern "HADES-$VERSION-debian-amd64.deb"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir .hades-release --pattern "HADES-$VERSION-debian-amd64.deb.sha256"

      - name: Validar integridade final
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          root=Path('.hades-release')
          version=os.environ['VERSION']
          files=[
              root / f'HADES-Setup-{version}-windows-x64.exe',
              root / f'HADES-{version}-debian-amd64.deb',
          ]
          for path in files:
              if not path.is_file():
                  raise SystemExit(f'Arquivo ausente: {path.name}')
              side=Path(str(path)+'.sha256')
              if not side.is_file():
                  raise SystemExit(f'Hash ausente: {side.name}')
              expected=side.read_text(encoding='utf-8').strip().split()[0].lower()
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              actual=h.hexdigest()
              if expected != actual:
                  raise SystemExit(f'SHA-256 inválido para {path.name}')
              print(f'OK: {path.name} {actual}')

      - name: Publicar release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          echo "Release $TAG publicada. O workflow do manifesto estável será acionado."
