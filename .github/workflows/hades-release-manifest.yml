name: HADES - Atualizar manifesto da Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release, exemplo: hades-v0.9.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-manifest:
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'hades-v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver tag e versão
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#hades-v}" >> "$GITHUB_ENV"

      - name: Baixar artefatos oficiais da release
        shell: bash
        run: |
          mkdir -p .hades-release
          gh release download "$TAG" --dir .hades-release --pattern "HADES-Setup-*-windows-x64.exe" || true
          gh release download "$TAG" --dir .hades-release --pattern "HADES-*-debian-amd64.deb" || true
          find .hades-release -maxdepth 1 -type f -printf '%f\n'

      - name: Gerar manifesto estável com SHA-256
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path(".hades-release")
          assets = []

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          for path in sorted(root.glob("*")):
              if path.name.endswith("-windows-x64.exe"):
                  assets.append({
                      "os": "windows",
                      "arch": "x86_64",
                      "package": "exe",
                      "name": path.name,
                      "url": f"https://github.com/${{ github.repository }}/releases/download/{os.environ['TAG']}/{path.name}",
                      "sha256": digest(path),
                      "size": path.stat().st_size,
                  })
              elif path.name.endswith("-debian-amd64.deb"):
                  assets.append({
                      "os": "linux",
                      "distros": ["debian", "ubuntu"],
                      "arch": "x86_64",
                      "package": "deb",
                      "name": path.name,
                      "url": f"https://github.com/${{ github.repository }}/releases/download/{os.environ['TAG']}/{path.name}",
                      "sha256": digest(path),
                      "size": path.stat().st_size,
                  })

          if not assets:
              raise SystemExit("Nenhum artefato HADES compatível foi encontrado na release.")

          manifest = {
              "schema": 1,
              "product": "HADES",
              "channel": "stable",
              "latest": os.environ["VERSION"],
              "published_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "notes": f"Atualização oficial HADES {os.environ['VERSION']}.",
              "assets": assets,
          }
          target = Path("HADES/manifests/stable.json")
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commitar manifesto
        shell: bash
        run: |
          git config user.name "ATLAS HADES Release Bot"
          git config user.email "hades-release-bot@users.noreply.github.com"
          git add HADES/manifests/stable.json
          if git diff --cached --quiet; then
            echo "Manifesto já estava atualizado."
            exit 0
          fi
          git commit -m "HADES: atualizar manifesto para $VERSION"
          git push
